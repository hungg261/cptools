name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
          pip install -e .

      - name: install (macOS/Windows)
        if: runner.os != 'Linux'
        run: pip install -e .

      - name: install pytest
        run: pip install pytest

      - name: unit tests
        run: python -m pytest -v

      - name: GUI smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest tests/test_runner_gui_smoke.py -v